name: evolua_pro
description: "EvoluaPRO - Gerador de evoluções de enfermagem. Multiplataforma (Android, iOS, Windows, macOS, Linux e Web)."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Persistence (cross-platform: Android, iOS, Windows, macOS, Linux, Web)
  shared_preferences: ^2.2.3

  # Env variables
  flutter_dotenv: ^5.1.0

  # UI
  google_fonts: ^6.2.1
  intl: ^0.19.0

  # Utilities
  uuid: ^4.4.0

  # Auth / security
  crypto: ^3.0.3
  flutter_secure_storage: ^9.2.2
  pdf: ^3.12.0
  printing: ^5.14.3
  share_plus: ^12.0.2

  # Login federado com Google (Android/iOS/Web). Em Windows desktop o
  # plugin oficial não tem suporte — caímos para fluxo via browser
  # externo (url_launcher) ou simplesmente desabilitamos.
  google_sign_in: ^6.2.1

  # Anúncios — apenas mobile (Android/iOS). Não roda em desktop nem web.
  google_mobile_ads: ^5.1.0

  # HTTP para falar com o gateway de pagamento (Asaas) e backend próprio.
  http: ^1.2.2

  # Abrir URLs externas (checkout Asaas, área do cliente, etc).
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
