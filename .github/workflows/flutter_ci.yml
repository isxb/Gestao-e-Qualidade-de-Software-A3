name: Flutter CI — EvoluaPRO

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ==============================================================
  # JOB 1: Análise estática + Testes + Cobertura
  # ==============================================================
  test:
    name: Testes Automatizados
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Flutter (estável)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Criar .env mínimo para testes
        run: printf 'ASAAS_API_KEY=sandbox_test_key\nASSAS_BASE_URL=https://sandbox.asaas.com\n' > .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Análise estática (lint)
        run: flutter analyze --no-fatal-warnings --no-fatal-infos || true

      - name: Executar testes com cobertura
        run: flutter test --coverage --reporter=expanded

      - name: Exibir resumo de cobertura
        if: always()
        run: |
          if [ -f coverage/lcov.info ]; then
            echo "=== Resumo de Cobertura ==="
            LF=$(grep "^LF:" coverage/lcov.info | awk -F: '{s+=$2} END{print s+0}')
            LH=$(grep "^LH:" coverage/lcov.info | awk -F: '{s+=$2} END{print s+0}')
            echo "Linhas cobertas: ${LH} / ${LF}"
          fi

      - name: Publicar relatório de cobertura (Codecov)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: coverage/lcov.info
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # ==============================================================
  # JOB 2: Build de verificação (garante que o app compila)
  # ==============================================================
  build:
    name: Build Android (verificação)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Java 17 (necessário para Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter (estável)
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true

      - name: Criar .env mínimo para build
        run: printf 'ASAAS_API_KEY=sandbox_test_key\nASSAS_BASE_URL=https://sandbox.asaas.com\n' > .env

      - name: Instalar dependências
        run: flutter pub get

      - name: Build APK (debug)
        run: flutter build apk --debug --no-tree-shake-icons
